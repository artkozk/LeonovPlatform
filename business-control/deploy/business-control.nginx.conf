server {
    listen 80;
    listen [::]:80;
    server_name business-control.85-198-82-221.sslip.io;

    client_max_body_size 1m;
    auth_basic "Founders workspace";
    auth_basic_user_file /etc/nginx/business-control.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

    location / {
        proxy_pass http://127.0.0.1:8522;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
