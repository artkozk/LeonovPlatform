# PostgreSQL tuning for LeonovCare Platform on 8 vCPU / 11 GiB RAM host.
# Managed by Claude on 2026-05-16 (см. docs/operations/MULTI_INSTANCE_API_2026_05_16.md §2.1).
# Conservative production values, leave plenty of headroom for OS+pm2.
# All settings are append-only overrides loaded via conf.d after main file.
#
# Destination on server: /etc/postgresql/16/main/conf.d/99-leonovcare-100rps.conf

# --- memory ---
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 256MB

# --- connections ---
max_connections = 200

# --- WAL & checkpoints ---
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# --- planner ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- parallelism ---
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- logging ---
log_min_duration_statement = 250
log_lock_waits = on
log_temp_files = 16MB

# --- extensions ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
