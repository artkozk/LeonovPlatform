# nginx vhost for LeonovCare Platform — auto-managed by Claude on 2026-05-16.
#
# Назначение:
#   1. Принимать публичный трафик платформы на отдельном поддомене
#      platform.ngix.leonovcare.ru (см. docs/operations/100RPS_READINESS_2026_05_16.md §4.2).
#   2. Отдавать SPA-фронт прямо из frontend/dist (без `vite preview`).
#   3. Проксировать /api/v1/, /healthz, /readyz на Go-API на 127.0.0.1:8510.
#   4. Поддерживать SSE (/api/v1/support/stream): proxy_buffering off,
#      длинный read timeout, gzip отключён для event-stream.
#
# Append-only обоснование: см. docs/operations/PLATFORM_NGINX_VHOST_2026_05_16.md.
# Этот файл НЕ дублирует и НЕ трогает existing leonovcare.ru / e-rd.ru /
# shop.e-rd.ru / portfolio-default vhost'ы — nginx разводит их по Host header.
#
# 80-блок здесь только для ACME http-01 challenge от certbot --nginx.
# После выпуска сертификата certbot сам добавит 443-блок и редирект.

server {
    server_name platform.ngix.leonovcare.ru;

    # Лимит тела запроса под support-чат (5 файлов × 10 МБ + overhead).
    # Это nginx-уровень; backend ещё раз ограничивает per-route.
    client_max_body_size 64m;

    # SPA: статика прямо из frontend/dist.
    root /opt/leonovcare-platform/current/frontend/dist;
    index index.html;

    # API → Go backend.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }

    # SSE support stream: realtime требует выключить буферизацию gzip/proxy.
    location = /api/v1/support/stream {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8510; }
    location = /readyz  { proxy_pass http://127.0.0.1:8510; }

    # Кэш immutable-assets с длинным TTL (Vite кладёт build-hash в имя).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: всё, чего нет на диске, отдаём index.html
    # (React Router сам разрулит).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/platform.ngix.leonovcare.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/platform.ngix.leonovcare.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = platform.ngix.leonovcare.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name platform.ngix.leonovcare.ru;
    return 404; # managed by Certbot


}