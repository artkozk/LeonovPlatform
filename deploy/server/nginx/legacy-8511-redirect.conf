# Legacy port redirect — added 2026-05-17.
# Раньше на :8511 жил pm2 leonovcare-frontend (vite preview). Процесс
# удалён при переходе на nginx-edge (см. docs/operations/MULTI_INSTANCE_API_2026_05_16.md §2.2).
# Чтобы старые закладки/ссылки не упирались в пустоту, ловим запросы на :8511
# и редиректим на canonical-домен. 301 permanent — браузер обновит закладку.
server {
    listen 8511;
    listen [::]:8511;
    server_name _;
    return 301 https://platform.ngix.leonovcare.ru$request_uri;
}
