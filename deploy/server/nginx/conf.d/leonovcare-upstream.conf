# Upstream group для LeonovCare API — балансировка между pm2-инстансами.
#
# Внедрено 2026-05-16 (см. docs/operations/MULTI_INSTANCE_API_2026_05_16.md).
#
# Дизайн:
#   - Два процесса leonovcare-api / leonovcare-api-2 слушают 8510 и 8512.
#   - round-robin по умолчанию: nginx равномерно распределяет запросы.
#   - `keepalive 32` — переиспользуем upstream-соединения, экономим
#     TCP/TLS handshake на каждом запросе (важно при 100 RPS).
#   - `max_fails=3 fail_timeout=10s` — упавший процесс выводится из
#     ротации на 10 секунд, потом проверяется снова.
#
# realtime (SSE):
#   - Каждое SSE-соединение случайно попадает на один из двух процессов;
#     это нормально, потому что fan-out событий между процессами
#     обеспечивается Redis Pub/Sub в SupportHub.
#   - `keepalive` на SSE не помогает (соединение долгоживущее),
#     но и не мешает.
#
# Файл размещается в /etc/nginx/conf.d/leonovcare-upstream.conf
# (он подключается раньше sites-enabled, поэтому upstream доступен
# vhost'у platform.ngix.leonovcare.ru).
upstream leonovcare_api {
    server 127.0.0.1:8510 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8512 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
